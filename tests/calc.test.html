<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>calc.js・merge.js のテスト</title>
<style>
  body { font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; margin: 0; padding: 16px; line-height: 1.6; }
  .ok { color: #16a34a; }
  .ng { color: #dc2626; font-weight: 600; }
</style>
</head>
<body>
<h1>calc.js・merge.js のテスト</h1>
<p id="summary">実行中…</p>
<ul id="list"></ul>
<script type="module">
  import { run as runCalc } from "./calc.test.mjs";
  import { run as runMerge } from "./merge.test.mjs";
  const results = [...runCalc(), ...runMerge()];
  const list = document.getElementById("list");
  for (const r of results) {
    const li = document.createElement("li");
    li.className = r.ok ? "ok" : "ng";
    li.textContent = `${r.ok ? "✓" : "✗"} ${r.name}${r.ok ? "" : `：${r.message}`}`;
    list.append(li);
  }
  const failed = results.filter((r) => !r.ok).length;
  const summary = document.getElementById("summary");
  summary.className = failed ? "ng" : "ok";
  summary.textContent = failed ? `${failed} 件失敗` : `すべて成功（${results.length} 件）`;
</script>
</body>
</html>
