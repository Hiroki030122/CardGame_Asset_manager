<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カード管理｜動作確認</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1d1f23; --sub:#6b7280; --ok:#16a34a; --ng:#dc2626; --accent:#2563eb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.lead { color:var(--sub); margin:0 0 20px; font-size:14px; }
  section { background:var(--card); border-radius:12px; padding:16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  h2 { font-size:16px; margin:0 0 8px; display:flex; align-items:center; gap:8px; }
  .mark { font-size:18px; }
  .ok { color:var(--ok); } .ng { color:var(--ng); }
  button { font:inherit; font-size:15px; padding:10px 16px; border-radius:8px; border:0; background:var(--accent); color:#fff; cursor:pointer; margin:4px 8px 4px 0; }
  button.sub { background:#e5e7eb; color:var(--text); }
  button:disabled { opacity:.4; cursor:default; }
  code, .uid { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; background:#f1f3f5; padding:8px; border-radius:6px; display:block; word-break:break-all; margin:6px 0; }
  .msg { font-size:14px; color:var(--sub); margin-top:6px; white-space:pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>カード管理｜動作確認</h1>
  <p class="lead">この3つがすべて ✅ になれば準備完了です。</p>

  <section>
    <h2><span class="mark" id="m1">⏳</span>① Firebase につながる</h2>
    <div class="msg" id="s1">確認中…</div>
  </section>

  <section>
    <h2><span class="mark" id="m2">⬜</span>② Google でログイン</h2>
    <button id="login">Google でログイン</button>
    <button id="logout" class="sub" hidden>ログアウト</button>
    <div class="msg" id="s2">まだログインしていません</div>
    <div id="uidBox" hidden>
      <div class="msg">あなたの ID（書き込みルールに貼る値）：</div>
      <span class="uid" id="uid"></span>
      <button id="copy" class="sub">ID をコピー</button>
    </div>
  </section>

  <section>
    <h2><span class="mark" id="m3">⬜</span>③ 保存して、誰でも読める</h2>
    <button id="save" disabled>テスト保存</button>
    <div class="msg" id="s3">ログインすると保存を試せます。</div>
    <div class="msg">保存されているデータ（ログインしていなくても見える）：</div>
    <code id="doc">—</code>
  </section>
</main>

<script type="module">
  import { firebaseConfig } from "./firebase-config.js";
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut }
    from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, onSnapshot, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const $ = (id) => document.getElementById(id);
  const set = (markId, msgId, ok, text) => { $(markId).textContent = ok ? "✅" : "❌"; $(msgId).textContent = text; };

  if (String(firebaseConfig.apiKey).includes("書き換える")) {
    set("m1", "s1", false, "firebase-config.js がまだ書き換えられていません。\nFirebase の firebaseConfig を貼り付けてください。");
    throw new Error("config not set");
  }

  let app, auth, db;
  try {
    app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getFirestore(app);
  } catch (e) {
    set("m1", "s1", false, "初期化できませんでした：" + e.message);
    throw e;
  }

  const testRef = doc(db, "test", "hello");

  // ① 読み込み（誰でも読めるか）
  onSnapshot(testRef,
    (snap) => {
      set("m1", "s1", true, "つながりました（プロジェクト：" + firebaseConfig.projectId + "）");
      $("doc").textContent = snap.exists() ? JSON.stringify(snap.data(), null, 2) : "（まだ何も保存されていません）";
    },
    (err) => {
      set("m1", "s1", false, "読み込めませんでした：" + err.code +
        (err.code === "permission-denied" ? "\n→ Firestore のルールで読み込みが許可されていません。" : ""));
    });

  // ② ログイン
  const provider = new GoogleAuthProvider();
  getRedirectResult(auth).catch(() => {});
  $("login").onclick = async () => {
    try {
      await signInWithPopup(auth, provider);
    } catch (e) {
      if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") {
        await signInWithRedirect(auth, provider);
      } else if (e.code === "auth/unauthorized-domain") {
        set("m2", "s2", false, "このサイトのドメインが許可されていません。\n→ Authentication → 設定 → 承認済みドメイン に「" + location.hostname + "」を追加してください。");
      } else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") {
        set("m2", "s2", false, "ログインできませんでした：" + e.code);
      }
    }
  };
  $("logout").onclick = () => signOut(auth);
  $("copy").onclick = async () => {
    try { await navigator.clipboard.writeText($("uid").textContent); $("copy").textContent = "コピーしました"; }
    catch { $("copy").textContent = "長押しで選んでコピーしてください"; }
  };

  onAuthStateChanged(auth, (user) => {
    $("login").hidden = !!user;
    $("logout").hidden = !user;
    $("uidBox").hidden = !user;
    $("save").disabled = !user;
    if (user) {
      set("m2", "s2", true, (user.displayName || "") + "（" + (user.email || "") + "）でログイン中");
      $("uid").textContent = user.uid;
    } else {
      $("m2").textContent = "⬜";
      $("s2").textContent = "まだログインしていません";
    }
  });

  // ③ 保存
  $("save").onclick = async () => {
    $("s3").textContent = "保存中…";
    try {
      await setDoc(testRef, {
        message: "保存テスト成功",
        by: auth.currentUser.email || auth.currentUser.uid,
        at: serverTimestamp(),
        device: navigator.userAgent.slice(0, 80)
      });
      set("m3", "s3", true, "保存できました。別の端末（ログインしていない状態）でも、下の内容が見えれば完了です。");
    } catch (e) {
      set("m3", "s3", false, "保存できませんでした：" + e.code +
        (e.code === "permission-denied" ? "\n→ ルールの UID が、上に表示されている ID と一致しているか確認してください。" : ""));
    }
  };
</script>
</body>
</html>
